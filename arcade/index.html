<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>UNATOM &middot; ARCADE</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background:
      radial-gradient(1200px 800px at 50% -10%, #2b1c10 0%, transparent 60%),
      radial-gradient(900px 600px at 50% 110%, #1a0f08 0%, transparent 60%),
      #14100a;
    color: #efe0c1;
    font-family: Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* subtle wood-grain look via layered gradients */
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background:
      repeating-linear-gradient(
        90deg,
        transparent 0 60px,
        rgba(255,180,110,0.02) 60px 62px,
        transparent 62px 140px
      ),
      repeating-linear-gradient(
        90deg,
        transparent 0 220px,
        rgba(255,180,110,0.03) 220px 224px,
        transparent 224px 480px
      );
    opacity: 0.9;
    z-index: 0;
  }
  main, header, footer { position: relative; z-index: 1; }

  header {
    padding: 56px 24px 24px;
    text-align: center;
    max-width: 1280px;
    margin: 0 auto;
  }
  header .brand {
    display: inline-flex; align-items: baseline; gap: 14px;
    font-family: Impact, "Arial Black", sans-serif;
    font-weight: 900;
    letter-spacing: 0.02em;
  }
  header .brand .u { font-size: 56px; color: #f7d03a;
    text-shadow: 4px 4px 0 #c43a1f, 4px 4px 0 #1a1410, -1px -1px 0 #1a1410,
      1px -1px 0 #1a1410, -1px 1px 0 #1a1410, 1px 1px 0 #1a1410,
      5px 5px 0 #1a1410; }
  header .brand .sub { font-size: 14px; color: #9c8b6d; letter-spacing: 8px;
    text-transform: uppercase; font-family: Impact, sans-serif; }
  header .tagline {
    margin: 22px auto 0;
    font-style: italic;
    color: #c7b48a;
    font-size: 17px;
    letter-spacing: 0.04em;
    max-width: 640px;
  }
  header .note {
    margin: 8px auto 0;
    color: #6b5c40;
    font-size: 11px;
    letter-spacing: 4px;
    font-family: Impact, sans-serif;
    text-transform: uppercase;
  }

  section.hero {
    display: grid; place-items: center;
    padding: 32px 20px 44px;
  }
  section.hero .card-slot {
    width: min(420px, 88vw);
    filter: drop-shadow(0 28px 45px rgba(0,0,0,0.7));
    transform: rotate(-1.3deg);
    transition: transform 0.4s ease;
  }
  section.hero .card-slot:hover { transform: rotate(0deg) scale(1.02); }
  section.hero .card-slot svg { display: block; width: 100%; height: auto; }

  section.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 32px 22px;
    max-width: 1280px;
    margin: 0 auto;
    padding: 20px 24px 60px;
  }
  section.grid .card-slot {
    filter: drop-shadow(0 18px 28px rgba(0,0,0,0.55));
    transition: transform 0.35s ease, filter 0.35s ease;
  }
  section.grid .card-slot:nth-child(3n) { transform: rotate(1.4deg); }
  section.grid .card-slot:nth-child(3n+1) { transform: rotate(-1.6deg); }
  section.grid .card-slot:nth-child(3n+2) { transform: rotate(0.6deg); }
  section.grid .card-slot:hover {
    transform: rotate(0deg) scale(1.05);
    filter: drop-shadow(0 26px 40px rgba(0,0,0,0.75));
    z-index: 5;
  }
  section.grid .card-slot svg { display: block; width: 100%; height: auto; }

  footer {
    padding: 40px 24px 60px;
    text-align: center;
    color: #6b5c40;
    font-size: 12px;
    letter-spacing: 4px;
    font-family: Impact, sans-serif;
    text-transform: uppercase;
    line-height: 1.9;
  }
  footer .divider {
    width: 60px; height: 2px; background: #6b5c40;
    margin: 0 auto 22px;
  }
  footer .pitch {
    font-family: Georgia, serif; font-style: italic; font-size: 15px;
    color: #c7b48a; letter-spacing: 0.03em; text-transform: none;
    margin: 0 0 18px;
  }
  footer .fine {
    font-size: 10px; letter-spacing: 3px; color: #4a3f2a;
  }

  @media (max-width: 640px) {
    header { padding: 36px 16px 16px; }
    header .brand .u { font-size: 40px; }
    section.hero { padding: 20px 16px 28px; }
    section.hero .card-slot { width: 84vw; }
    section.grid { grid-template-columns: repeat(2, 1fr); gap: 22px 16px; padding: 12px 16px 40px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="u">UNATOM</span>
    <span class="sub">Arcade</span>
  </div>
  <p class="tagline">Play a bit &middot; Close the block &middot; Win the chain</p>
  <p class="note">Concept prototype &middot; visualization only &middot; not for sale</p>
</header>

<section class="hero">
  <div class="card-slot" id="back-slot"></div>
</section>

<section class="grid" id="grid"></section>

<footer>
  <div class="divider"></div>
  <p class="pitch">A trading card game where the chain decides who becomes rare.</p>
  <p>UNATOM &middot; 2026 &middot; The Trading Card Game of Digital Matter</p>
  <p class="fine">Prototype for community feedback &middot; art subject to change</p>
</footer>

<script src="../unatom-render.js"></script>
<script src="./arcade-frame.js"></script>
<script>
  // 6 curated specimens — every rarity tier represented so the whole
  // Rodarmor ladder is visible in the prototype gallery.
  const SPECIMENS = [
    {
      block: 111, nickname: 'THE EMBER', schemeOverride: 'ember', symOverride: 'Hi',
      rarity: 'common',    integrity: 50,  cost: 1,
      signalName: 'SPARK',    signalText: 'deal 20. burn one BIT from the Block.',
      strike: '/ 9,850',
    },
    {
      block: 986, nickname: 'THE CHALK', schemeOverride: 'chalk', symOverride: 'Ws',
      rarity: 'uncommon',  integrity: 70,  cost: 2,
      signalName: 'WITNESS',  signalText: 'reveal top 2 of your Mempool. keep one.',
      strike: '/ 1,000',
    },
    {
      block: 8562, nickname: 'THE DRIP', schemeOverride: 'aqua', symOverride: 'Ts',
      rarity: 'rare',      integrity: 80,  cost: 3,
      signalName: 'TRICKLE',  signalText: 'heal 30. draw one BIT from the Void.',
      strike: '/ 5',
    },
    {
      block: 666, nickname: 'THE ASH', schemeOverride: 'ash', symOverride: 'As',
      force: ['flameborn'],
      rarity: 'epic',      integrity: 90,  cost: 4,
      signalName: 'SCATTER',  signalText: 'deal 60. send 3 BITs to the Void.',
      strike: 'STRIKE 042 / 10',
    },
    {
      block: 3113, nickname: 'THE LOCK', schemeOverride: 'ember', symOverride: 'Dy',
      rarity: 'legendary', integrity: 100, cost: 5,
      signalName: 'SEAL',     signalText: 'target UNATOM\u2019s Signal is silenced this turn.',
      strike: 'STRIKE 007 / 5',
    },
    {
      block: 4269, nickname: 'THE IGNITE', schemeOverride: 'rust', symOverride: 'Ck',
      force: ['flameborn'],
      rarity: 'mythic',    integrity: 120, cost: 6,
      signalName: 'INFERNO',  signalText: 'deal 100. clear the Block to the Void.',
      strike: 'STRIKE 001 / 001',
    },
  ];

  // Back
  document.getElementById('back-slot').innerHTML = ARCADE.renderBack({ label: '#001' });

  // Grid
  const grid = document.getElementById('grid');
  SPECIMENS.forEach(spec => {
    const slot = document.createElement('div');
    slot.className = 'card-slot';
    slot.innerHTML = ARCADE.renderFace(spec);
    grid.appendChild(slot);
  });
</script>

</body>
</html>
