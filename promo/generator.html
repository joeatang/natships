<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>UNATOMS · promo generator</title>
  <style>
    :root{
      --bg:#0a0a0c; --ink:#f3eee3; --orange:#f0962d; --cyan:#5dd0e3;
      --warm:#f9bc4f; --green:#7dcf5b; --pink:#f17d8e;
      --muted:rgba(243,238,227,0.55); --line:rgba(243,238,227,0.12);
    }
    html,body{margin:0;background:#111;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;}
    body{padding:24px;display:flex;flex-direction:column;align-items:center;gap:16px;}
    #card{
      width:1080px;height:1080px;position:relative;overflow:hidden;
      background:var(--bg);color:var(--ink);
      isolation:isolate;
    }
    .picker{display:flex;flex-wrap:wrap;gap:6px;max-width:1080px;}
    .picker button{
      background:#1a1a20;color:var(--ink);border:1px solid var(--line);
      padding:6px 10px;border-radius:6px;font:600 11px ui-monospace,monospace;cursor:pointer;
    }
    .picker button:hover{background:#2a2a34;border-color:var(--orange);}
    .u-svg{display:block;}
    .u-svg svg{display:block;width:100%;height:100%;}
  </style>
</head>
<body>
  <div class="picker" id="picker"></div>
  <div id="card"></div>

  <script src="../unatom-render.js"></script>
  <script src="./cards.js"></script>
  <script src="./entropy.js"></script>
  <script>
    // build picker
    const picker = document.getElementById('picker');
    for (const name of Object.keys(CARDS)) {
      const b = document.createElement('button');
      b.textContent = name;
      b.onclick = () => window.renderCard(name);
      picker.appendChild(b);
    }
    // global entrypoint for Playwright
    window.renderCard = (name) => {
      const fn = CARDS[name];
      if (!fn) { console.error('no card', name); return false; }
      document.getElementById('card').innerHTML = '';
      fn(document.getElementById('card'));
      document.title = 'UNATOMS · ' + name;
      return true;
    };
    // default view on load
    const first = Object.keys(CARDS)[0];
    if (first) window.renderCard(first);
  </script>
</body>
</html>
